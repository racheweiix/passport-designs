<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Passport designs</title>
<meta name="description" content="EventNook digital passport designs. Scroll, and each passport opens so you can look inside.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap">
<style>
/* A passport office on paper: each design is a passport booklet that floats on the desk, flies to the middle
   when chosen, opens on its spine, and shows the real passport inside. EventNook brand: DM Sans, Ink, Nook Blue. */
:root{--ink:#1E0E62;--ink-soft:#4A4380;--blue:#00B0F0;--action:#0071E3;--paper:#F3EEE4;
  --m:clamp(16px,3vw,40px);--bar:64px;--pick:70px;--H:600px;--W:420px;
  --ease:cubic-bezier(.65,0,.25,1);--out:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y mandatory;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 17px/1.5 'DM Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* ---------- the paper ---------- */
.paper{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 70% 60% at 50% 42%,rgba(255,255,255,.6),rgba(255,255,255,0) 70%),
  radial-gradient(ellipse 130% 100% at 50% 50%,rgba(0,0,0,0) 55%,rgba(120,96,60,.13)),var(--paper)}
.grain{position:absolute;inset:0}
.rosette{position:absolute;left:50%;top:52%;width:min(118vmin,1180px);transform:translate(-50%,-50%);color:var(--ink);opacity:.06}
.inkstamp{position:absolute;color:#2C44B0;opacity:.11}
.s1{width:clamp(130px,15vw,210px);right:calc(var(--m) + 3vw);top:calc(var(--bar) + 4vh);transform:rotate(14deg)}
.s2{width:clamp(150px,17vw,250px);left:-28px;bottom:calc(var(--pick) + 4vh);transform:rotate(-9deg)}
.narrow .s1{top:auto;bottom:calc(var(--pick) + 30vh);right:-30px}

/* ---------- the stage ---------- */
.snaps{position:relative;z-index:0}
.snaps div{height:100vh;height:100svh;scroll-snap-align:start}
.stage{position:fixed;inset:0;z-index:2;overflow:hidden}
.bar{position:absolute;left:0;right:0;top:0;height:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 var(--m);z-index:30}
.wm{font:800 25px/1 'DM Sans',sans-serif;letter-spacing:-.04em;color:var(--ink);text-decoration:none}
.wm b{color:var(--blue);font-weight:800}
.count{font:700 15px/1.2 'DM Sans',sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.count small{display:block;font-size:13px;font-weight:500;color:var(--ink-soft)}

.intro{position:absolute;z-index:20;transition:opacity .5s ease,transform .7s var(--out),visibility 0s 0s}
.wide .intro{left:var(--m);top:50%;transform:translateY(-54%);width:min(34vw,500px)}
.narrow .intro{left:var(--m);right:var(--m);top:calc(var(--bar) + 6px)}
.intro h1{font-weight:800;font-size:clamp(46px,5.6vw,92px);line-height:.92;letter-spacing:-.05em}
.narrow .intro h1{font-size:clamp(40px,11.5vw,62px)}
.intro p{margin-top:22px;font-size:clamp(17px,1.35vw,21px);line-height:1.45;max-width:31ch}
.narrow .intro p{margin-top:12px;font-size:16px;max-width:36ch}
.intro .acts{margin-top:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.narrow .intro .acts{margin-top:16px}
.intro .note{margin-top:22px;font-size:14px;color:var(--ink-soft)}
.narrow .intro .note{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;background:var(--ink);color:#fff;font:700 17px/1 'DM Sans',sans-serif;transition:background-color .15s ease,transform .15s ease}
.btn:hover{background:var(--action)}
.btn:active{transform:scale(.98)}
.hint{font-size:15px;color:var(--ink-soft)}
.away .intro{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s ease,transform .6s var(--out),visibility 0s .6s}
.wide.away .intro{transform:translateY(-54%) translateY(-18px)}
.narrow.away .intro{transform:translateY(-18px)}

/* ---------- a passport ---------- */
.slots{position:absolute;inset:0;z-index:10}
.slot{position:absolute;left:0;top:0;width:var(--W);height:var(--H);margin:calc(var(--H) / -2) 0 0 calc(var(--W) / -2);
  transition:transform .8s var(--ease),filter .5s ease,opacity .5s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.slot.active.open{cursor:default}
.slot.aside{filter:blur(1.8px) saturate(.85);opacity:.8}
.narrow .slot.aside{opacity:.55}
.instant .slot,.instant .slot *{transition:none!important}
.shadow{position:absolute;left:7%;right:7%;bottom:calc(var(--H) * -.075);height:calc(var(--H) * .08);border-radius:50%;
  background:radial-gradient(closest-side,rgba(40,24,80,.32),rgba(40,24,80,0));
  animation:shade var(--dur) ease-in-out var(--del) infinite;transition:left .8s var(--ease) .25s,right .8s var(--ease) .25s}
.wide .slot.open .shadow{left:-92%;right:-92%}
@keyframes shade{50%{transform:scale(.84);opacity:.62}}
.float{position:absolute;inset:0;perspective:1800px;animation:bob var(--dur) ease-in-out var(--del) infinite}
@keyframes bob{0%,100%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(0,var(--amp,-15px),0) rotate(var(--wob,1deg))}}
.slot.active{--amp:-6px;--wob:.3deg}
.tilt{position:absolute;inset:0;transform:rotateX(var(--ty,0deg)) rotateY(var(--tx,0deg));transition:transform .7s var(--out)}
.zoom{position:absolute;inset:0;perspective:2600px;transform:scale(.9);transition:transform .9s var(--out)}
.step0 .slot:hover .zoom{transform:scale(.97)}
.slot.open .zoom{transform:scale(1);transition-delay:.75s}
.book{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s var(--ease)}
.wide .slot.open .book{transform:translateX(50%);transition-delay:.25s}

/* inside: the page that holds the real passport */
.inside{position:absolute;inset:0;border-radius:4px 14px 14px 4px;background:var(--pg);
  box-shadow:2px 0 0 var(--pg2),3px 1px 0 var(--pg),5px 1px 0 var(--pg2),6px 2px 0 var(--pg),0 22px 44px -20px rgba(30,14,98,.45)}
.inside::before{content:"";position:absolute;inset:0 auto 0 0;width:16%;border-radius:4px 0 0 4px;background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,0));pointer-events:none;z-index:3}
.screen{position:absolute;inset:calc(var(--H) * .028);border-radius:calc(var(--H) * .022);overflow:hidden;background:var(--sbg);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.media{position:absolute;left:0;top:0;width:430px;border:0;display:block;transform-origin:0 0;transform:scale(var(--ms,1));pointer-events:none;background:var(--sbg)}
.slot.open .media{animation:pan var(--pd,20s) ease-in-out 1.7s infinite alternate}
.slot.open .screen:hover .media{animation-play-state:paused}
@keyframes pan{from{transform:scale(var(--ms,1)) translateY(0)}to{transform:scale(var(--ms,1)) translateY(var(--pt,0px))}}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:600 calc(var(--H) * .022)/1.3 'DM Sans',sans-serif;color:var(--dp-ink);opacity:.7}
.screen.ready .loading{display:none}
.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.28) 45%,rgba(190,225,255,.18) 51%,rgba(255,200,240,.14) 57%,rgba(255,255,255,0) 68%);background-size:300% 100%;background-position:100% 0;opacity:0}
.slot.open .sheen{animation:sweep 1.6s var(--out) 1s both}
@keyframes sweep{0%{opacity:1;background-position:100% 0}100%{opacity:1;background-position:0 0}}
.tap{position:absolute;left:50%;bottom:calc(var(--H) * .03);transform:translate(-50%,10px);padding:.62em 1.05em;border-radius:999px;background:rgba(20,12,60,.88);color:#fff;font:700 calc(var(--H) * .021)/1 'DM Sans',sans-serif;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s var(--out);box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.slot.open .tap{opacity:1;transform:translate(-50%,0);transition-delay:1.3s}
.slot.open .screen:hover .tap{background:var(--action)}

/* the cover and its back (the data page) */
.cover{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;transition:transform .6s var(--ease)}
.slot.open .cover{transform:rotateY(-180deg);transition:transform .8s var(--ease) .25s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;transition:opacity .35s ease}
.narrow .slot.open .face{opacity:0;transition:opacity .3s ease 1s}
.front{border-radius:4px 14px 14px 4px;background:var(--cv);box-shadow:inset 4px 0 0 rgba(0,0,0,.14),inset 0 0 0 1px rgba(255,255,255,.14)}
.front::after{content:"";position:absolute;inset:0;background-image:var(--leather);opacity:.55;mix-blend-mode:multiply;pointer-events:none}
.front .art{position:absolute;inset:0;width:100%;height:100%}
.cv-title{position:absolute;left:9%;right:9%;top:8.5%;text-align:center;font:700 calc(var(--H) * .024)/1.35 'DM Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ct);z-index:2}
.cv-title small{display:block;font-size:.78em;letter-spacing:.24em;opacity:.85;margin-top:.3em}
.cv-sub{position:absolute;left:0;right:0;top:70%;text-align:center;font:800 calc(var(--H) * .032)/1 'DM Sans',sans-serif;letter-spacing:.28em;padding-left:.28em;text-transform:uppercase;z-index:2;
  background:linear-gradient(100deg,var(--f1) 0%,var(--f1) 38%,var(--f2) 50%,var(--f1) 62%,var(--f3) 100%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.slot.active .cv-sub{animation:foil 1.8s var(--out) .15s both}
@keyframes foil{from{background-position:100% 0}to{background-position:0 0}}
.cv-chip{position:absolute;left:50%;bottom:7.5%;width:calc(var(--H) * .062);transform:translateX(-50%);color:var(--f1);z-index:2}
.back{transform:rotateY(180deg);border-radius:14px 4px 4px 14px;background:var(--pg);color:var(--dp-ink);box-shadow:inset -1px 0 0 rgba(0,0,0,.06)}
.back::after{content:"";position:absolute;inset:0 0 0 auto;width:16%;background:linear-gradient(270deg,rgba(0,0,0,.14),rgba(0,0,0,0));pointer-events:none}
.dp{position:absolute;inset:0;padding:calc(var(--H) * .046);display:flex;flex-direction:column;gap:calc(var(--H) * .022)}
.dp .gl{position:absolute;inset:0;width:100%;height:100%;color:var(--gl);opacity:.55;pointer-events:none}
.dp > :not(.gl){position:relative}
.dp-top{display:flex;justify-content:space-between;gap:10px;font:700 calc(var(--H) * .0155)/1.2 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.dp h3{font:800 calc(var(--H) * .043)/1.02 'DM Sans',sans-serif;letter-spacing:-.035em;color:var(--dp-acc);max-width:14ch}
.dp-row{display:grid;grid-template-columns:34% 1fr;gap:calc(var(--H) * .024);align-items:start}
.dp-photo{aspect-ratio:3/4;border-radius:calc(var(--H) * .012);overflow:hidden;background:var(--cv);position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.dp-photo svg{position:absolute;inset:0;width:100%;height:100%}
.dp dl{display:grid;gap:calc(var(--H) * .013)}
.dp dt{font:700 calc(var(--H) * .0145)/1.2 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.62}
.dp dd{margin-top:2px;font:600 calc(var(--H) * .0205)/1.25 'DM Sans',sans-serif}
.dp-line{font:500 calc(var(--H) * .022)/1.4 'DM Sans',sans-serif}
.dp-go{align-self:flex-start;margin-top:auto;display:inline-flex;align-items:center;gap:.5em;padding:.85em 1.25em;border-radius:999px;background:var(--dp-btn);color:var(--dp-btn-ink);font:700 calc(var(--H) * .022)/1 'DM Sans',sans-serif;transition:transform .15s ease,filter .15s ease}
.dp-go:hover{filter:brightness(1.1)}
.dp-go:active{transform:scale(.97)}
.mrz{font:500 calc((var(--W) - var(--H) * .092) / 26.8)/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow:hidden;opacity:.78}

/* ---------- caption (phones), picker, viewer ---------- */
.caption{position:absolute;left:var(--m);right:var(--m);bottom:calc(var(--pick) + 8px);z-index:20;text-align:center;display:none}
.narrow.away .caption{display:block}
.short.away .caption{display:none}
.short .wm{font-size:21px}
.short .count{font-size:13.5px}
.short .count small{font-size:12px}
.short .intro h1{font-size:clamp(32px,10vw,44px)}
.short .intro p{margin-top:8px;font-size:14.5px;line-height:1.4}
.short .intro .acts{margin-top:12px}
.short .intro .btn{min-height:44px;font-size:15.5px;padding:0 20px}
@media (max-height:660px){.short .intro p{display:none}}
.short .slot{--amp:-8px}
.short .slot.active{--amp:-4px}
.caption h2{font:800 22px/1.1 'DM Sans',sans-serif;letter-spacing:-.025em}
.caption p{font-size:15px;line-height:1.4;margin-top:6px;color:var(--ink-soft)}
.caption .btn{margin-top:12px;min-height:46px;font-size:16px}
.caption.swap{animation:capin .6s var(--out)}
@keyframes capin{from{opacity:0;transform:translateY(8px)}}
.picker{position:absolute;left:50%;bottom:max(var(--pick-b,14px),env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;display:flex;gap:4px;padding:5px;border-radius:999px;
  background:rgba(255,253,248,.94);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 12px 30px -14px rgba(30,14,98,.4),0 0 0 1px rgba(30,14,98,.09);
  max-width:calc(100vw - 2 * var(--m));overflow-x:auto;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.picker button{flex:none;min-height:42px;padding:0 16px;border-radius:999px;font:700 14px/1 'DM Sans',sans-serif;color:var(--ink-soft);white-space:nowrap;transition:background-color .2s ease,color .2s ease}
.picker button:hover{color:var(--ink);background:rgba(30,14,98,.06)}
.picker button[aria-current="true"]{background:var(--ink);color:#fff}
/* absolute boxes only (no % heights in grid/flex): iPhone Safari could size the passport frame to 0 */
.viewer{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:var(--paper)}
.viewer[hidden]{display:none}
.vbar{position:absolute;left:0;right:0;top:0;height:66px;display:flex;align-items:center;gap:8px;padding:0 var(--m)}
.vt{flex:1;min-width:0;font:800 19px/1.15 'DM Sans',sans-serif;letter-spacing:-.02em}
.vt small{display:block;font:500 13.5px/1.35 'DM Sans',sans-serif;color:var(--ink-soft);letter-spacing:0;margin-top:2px}
.vbtn{min-width:44px;min-height:44px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(30,14,98,.13);font:700 15px/1 'DM Sans',sans-serif}
.vbtn:hover{background:#F2EEFF}
.vclose{background:var(--ink);color:#fff;box-shadow:none}
.vclose:hover{background:var(--action)}
.vbody{position:absolute;left:0;right:0;top:66px;bottom:0}
.vphone{position:absolute;top:4px;bottom:var(--m);left:50%;width:430px;max-width:calc(100% - 2 * var(--m));transform:translateX(-50%);border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 0 0 9px var(--ink),0 34px 60px -24px rgba(30,14,98,.5)}
.vphone iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;display:block}
@media (max-width:560px){.vbody{top:56px}.vphone{top:0;bottom:0;left:0;width:100%;max-width:none;transform:none;border-radius:0;box-shadow:none}.vbar{height:56px;padding:0 12px 0 16px}.vbar .vbtn.vnav{display:none}.vt{font-size:16.5px}.vt small{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vclose{min-height:40px}}

@media (prefers-reduced-motion:reduce){
  .float,.shadow,.media,.sheen,.cv-sub,.caption.swap{animation:none!important}
  .slot,.zoom,.book,.cover,.tilt,.intro,.face,.tap{transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<div class="paper" aria-hidden="true">
  <div class="grain" id="grain"></div>
  <svg class="rosette" id="rosette" viewBox="-200 -200 400 400"></svg>
  <svg class="inkstamp s1" viewBox="0 0 200 200"><defs><path id="ring1" d="M100 100m-73 0a73 73 0 1 1 146 0a73 73 0 1 1-146 0"/></defs>
    <g fill="none" stroke="currentColor"><circle cx="100" cy="100" r="94" stroke-width="5"/><circle cx="100" cy="100" r="86" stroke-width="1.6"/><circle cx="100" cy="100" r="55" stroke-width="1.6"/></g>
    <text font-family="DM Sans,sans-serif" font-weight="800" font-size="14" fill="currentColor"><textPath href="#ring1" textLength="452" lengthAdjust="spacing">EVENTNOOK ✦ PASSPORT CONTROL ✦ DIGITAL ✦</textPath></text>
    <text x="100" y="98" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="800" font-size="24" fill="currentColor">ENTRY</text>
    <text x="100" y="119" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="700" font-size="11" letter-spacing="2" fill="currentColor">SCAN TO COLLECT</text></svg>
  <svg class="inkstamp s2" viewBox="0 0 260 150"><g fill="none" stroke="currentColor"><rect x="4" y="4" width="252" height="142" rx="14" stroke-width="5"/><rect x="14" y="14" width="232" height="122" rx="8" stroke-width="1.5"/></g>
    <text x="130" y="62" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="800" font-size="32" letter-spacing="5" fill="currentColor">VISA</text>
    <text x="130" y="92" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="700" font-size="14" letter-spacing="3" fill="currentColor">STAMP COLLECTED</text>
    <text x="130" y="118" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="currentColor">EVENTNOOK ✦ ALL ACCESS</text></svg>
</div>

<div class="stage" id="stage">
  <header class="bar">
    <a class="wm" href="#" data-go="0" aria-label="eventnook, back to all passports">event<b>nook</b></a>
    <div class="count" id="count" aria-live="polite"></div>
  </header>
  <section class="intro" id="intro" aria-labelledby="h1">
    <h1 id="h1">Open a passport.</h1>
    <p>Six digital passport designs from EventNook events. Scroll, and each one flies in, opens and shows you around.</p>
    <div class="acts"><button class="btn" type="button" data-go="1">Open the first one</button><span class="hint">or scroll</span></div>
    <p class="note">Demo attendees and sample activities.</p>
  </section>
  <div class="slots" id="slots"></div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <nav class="picker" id="picker" aria-label="Passport designs"></nav>
</div>
<div class="snaps" id="snaps" aria-hidden="true"></div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vt" hidden>
  <div class="vbar">
    <div class="vt" id="vt"></div>
    <button class="vbtn vnav" type="button" id="vprev" aria-label="Previous passport">←</button>
    <button class="vbtn vnav" type="button" id="vnext" aria-label="Next passport">→</button>
    <button class="vbtn vclose" type="button" id="vclose">Close</button>
  </div>
  <div class="vbody"><div class="vphone" id="vphone"></div></div>
</div>

<noscript><p style="position:relative;z-index:5;padding:24px">Open the passports:
  <a href="https://reg.eventnook.com/myorder/mysessions/eid_M7cwNDLWdXU1MDUEAA/12779641LLBT?uid=a78123b2ad4c074d244f52b6cef43f19bd543c">NextGen HR Summit</a>,
  <a href="https://reg.eventnook.com/myorder/mysessions/eid_M7cwNDHVNXUxdTEFAA/12864701WJOJ?uid=a78145cc4f12ed8e004503a2488177a39807e4">The Singapore Tech Experience</a>.</p></noscript>

<script>

ant;animation-iteration-count:1!important;transition-duration:.01ms!important}}\n\n:root{--btn:#E8458F;--btn-ink:#fff;--toast:#C2185B;--scan:#FFD23F;--fin-bg:#FFE27A}\nbody{background:#FDEFE6;color:#2A1A22}\n.fam-top{background:linear-gradient(100deg,#F7894A 0%,#F06A6E 45%,#EA4C97 100%);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08)}\n.fam-top p{opacity:.95}\nmain{background:\n  radial-gradient(circle,rgba(244,150,190,.8) 3.4px,transparent 3.8px) 0 0/46px 46px,\n  radial-gradient(circle,rgba(246,192,90,.8) 3.4px,transparent 3.8px) 23px 23px/46px 46px,\n  repeating-linear-gradient(112deg,#FAD1E1 0 36px,#FDEFE6 36px 72px)}\n.bunting{display:block;width:100%;height:30px;position:relative;z-index:2}\n.hero{position:relative;padding:22px 22px 4px}\n.big{display:flex;align-items:baseline;gap:8px}\n.big b{font-size:clamp(56px,16vw,68px);line-height:.9;letter-spacing:-.05em;font-weight:800;color:#1C1218}\n.big span{font-size:32px;color:#8F7F88;font-weight:700;letter-spacing:-.02em}\n.sub{font-size:16px;color:#5B4A53;margin-top:10px}\n.ptsbox{position:absolute;right:clamp(16px,5vw,22px);top:24px;width:clamp(86px,23vw,100px);height:68px;border:3px solid #F2C230;border-radius:16px;display:grid;place-items:center;align-content:center;background:rgba(255,248,232,.7);text-align:center}\n.ptsbox b{font-size:26px;line-height:1;font-weight:800;display:block}\n.ptsbox span{font-size:13px;color:#5B4A53}\n.bar{margin-top:20px;height:17px;border-radius:999px;background:rgba(205,185,195,.5);overflow:hidden}\n.bar i{display:block;height:100%;width:calc(var(--p) * 100%);border-radius:inherit;background:repeating-linear-gradient(120deg,#EA4C97 0 12px,#F68BBE 12px 24px);transition:width .9s cubic-bezier(.2,.8,.2,1)}\n.rules{margin-top:12px;font-size:15px;line-height:1.5;color:#4A3942}\n.grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(9px,3.2vw,14px);padding:22px clamp(14px,4.6vw,20px) 6px}\n.tile{position:relative;min-width:0;aspect-ratio:1;border-r p fam-top\">\n  <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 18V6.5l11 11V6\"/><\/svg><\/div>\n  <div><h1>EventNook Family Day<\/h1><p><span data-count>5<\/span> of <span data-total>9<\/span> collected<\/p><\/div>\n  <div class=\"menu\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<\/header>\n<main>\n  <svg class=\"bunting\" viewBox=\"0 0 430 30\" preserveAspectRatio=\"none\" aria-hidden=\"true\" id=\"bunting\"><\/svg>\n  <section class=\"hero\">\n    <div class=\"big\"><b data-count>5<\/b><span>/ <span data-total>9<\/span><\/span><\/div>\n    <p class=\"sub\"><span class=\"when-progress\">Collected · <span data-left>4<\/span> to go<\/span><span class=\"when-complete\">All collected. Grand prize draw unlocked!<\/span><\/p>\n    <div class=\"ptsbox\"><b data-pts>4<\/b><span>of 8 pts<\/span><\/div>\n    <div class=\"bar\"><i><\/i><\/div>\n    <p class=\"rules\">Collect 3 in a row to win a mini prize. Collect all 8 to stand a chance to win the grand prize.<\/p>\n  <\/section>\n  <section class=\"grid\" id=\"grid\" aria-label=\"Activities\"><\/section>\n  <svg class=\"fair\" viewBox=\"0 0 430 260\" aria-hidden=\"true\">\n    <g stroke=\"#7A6470\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M120 128 86 246M120 128l34 118\"/><\/g>\n    <g class=\"wheel\">\n      <circle cx=\"120\" cy=\"128\" r=\"64\" fill=\"none\" stroke=\"#E8458F\" stroke-width=\"4\"/>\n      <g stroke=\"#F29BC0\" stroke-width=\"2\" id=\"spokes\"><\/g>\n      <g id=\"pods\"><\/g>\n      <circle cx=\"120\" cy=\"128\" r=\"8\" fill=\"#E8458F\"/>\n    <\/g>\n    <g>\n      <path d=\"M232 178 282 116l50 62z\" fill=\"#E2453A\"/>\n      <path d=\"M282 116l-14 62h12zM282 116l14 62h-12z\" fill=\"#fff\"/>\n      <rect x=\"240\" y=\"176\" width=\"84\" height=\"70\" fill=\"#fff\"/>\n      <g fill=\"#E2453A\"><rect x=\"240\" y=\"176\" width=\"14\" height=\"70\"/><rect x=\"268\" y=\"176\" width=\"14\" height=\"70\"/><rect x=\"296\" y=\"176\" width=\"14\" height=\"70\"/><\/g>\n      <rect x=\"236\" y=\"172\" width=\"92\" height=\"9\" rx=\"2\" fill=\"#F5B700\"/>\n      <path d=\"M268 246v-28a14 14 0 0 1 28 0v28z\" fill=\"#8C3A55\"/>\n      <path d=\"M282 116V92\" stroke=\"#7A6470\" stroke-width=\"2.5\"/><path d=\"M282 92l18 6-18 6z\" fill=\"#F5B700\"/>\n    <\/g>\n    <g class=\"bal\"><path d=\"M352 96l18 54M372 82l-2 68M392 100l-22 50\" stroke=\"#7A6470\" stroke-width=\"1.5\" fill=\"none\"/>\n      <ellipse cx=\"350\" cy=\"80\" rx=\"17\" ry=\"20\" fill=\"#E2453A\"/><ellipse cx=\"373\" cy=\"64\" rx=\"17\" ry=\"20\" fill=\"#E8458F\"/><ellipse cx=\"394\" cy=\"86\" rx=\"16\" ry=\"19\" fill=\"#F5B700\"/><\/g>\n    <path d=\"M344 182l26-30 26 30z\" fill=\"#EA4C97\"/><rect x=\"350\" y=\"182\" width=\"40\" height=\"64\" fill=\"#F5B700\"/><path d=\"M362 246v-18a8 8 0 0 1 16 0v18z\" fill=\"#8C5A3A\"/>\n    <path d=\"M40 247H400\" stroke=\"#9C8C95\" stroke-width=\"2\" stroke-dasharray=\"5 6\"/>\n  <\/svg>\n<\/main>\n<script>\nwindow.PP = {\n  stations: [\n    { name: 'Mini Bowling', done: true }, { name: 'Family Photo Challenge' }, { name: 'Treasure Hunt', done: true },\n    { name: 'Family Trivia', done: true }, { name: 'Free pass', done: true, auto: true }, { name: 'Balloon Sculpting' },\n    { name: 'Face Painting' }, { name: 'Lucky Fishing' }, { name: 'Pop the Balloon', done: true }\n  ],\n  finIcon: '🏆', finTitle: 'All 8 collected!',\n  finText: \"You're in the grand prize draw, with a mini prize for every three in a row.\",\n  confetti: ['#E8458F', '#F5B700', '#E2453A', '#F7894A', '#FFFFFF'],\n  render(n, T, S) { document.querySelector('[data-pts]').textContent = S.filter(s => s.done && !s.auto).length; },\n  onCollect(i) {\n    const S = this.stations, L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];\n    const won = L.filter(l => l.includes(i) && l.every(k => S[k].done));\n    if (!won.length) return `${S[i].name} collected · +1 pt`;\n    setTimeout(() => won.flat().forEach(k => { const t = document.querySelector(`[data-st=\"${k}\"]`); t.classList.remove('hit'); void t.offsetWidth; t.classList.add('hit'); }), 450);\n    return won.length > 1 ? `${won.length} lines of three! Mini prizes unlocked 🎁` : 'Three in a row! Mini prize unlocked 🎁';\n  }\n};\n(function () {\n  const rot = [-2.5, 0, 2, 1.5, 0, -1.5, 2, -2, 1.8];\n  const check = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>';\n  document.getElementById('grid').innerHTML = PP.stations.map((s, i) => s.auto\n    ? `<div class=\"tile stamp free\" data-st=\"${i}\" style=\"--r:${rot[i]}deg\"><svg class=\"star\" viewBox=\"0 0 24 24\"><path d=\"M12 2.5l2.9 6.2 6.6.7-5 4.5 1.4 6.6L12 17.2l-5.9 3.3 1.4-6.6-5-4.5 6.6-.7z\" fill=\"#F5B700\"/><\/svg><b>Free pass<\/b><small>Collected<\/small><\/div>`\n    : `<div class=\"tile stamp\" data-st=\"${i}\" style=\"--r:${rot[i]}deg\"><span class=\"ck y\">${check}<\/span><span class=\"num n\">${i + 1}<\/span><b>${s.name}<\/b><small><span class=\"y\">Collected · 1 pt<\/span><span class=\"n\">Not yet<\/span><\/small><\/div>`).join('');\n  const cols = ['#E8458F', '#F5B700', '#E2453A'];\n  document.getElementById('bunting').innerHTML = Array.from({ length: 12 }, (_, k) => `<path d=\"M${k * 36} 0h36l-18 28z\" fill=\"${cols[k % 3]}\"/>`).join('');\n  let sp = '', pd = '';\n  for (let k = 0; k < 8; k++) {\n    const a = k * Math.PI / 4, x = 120 + 64 * Math.cos(a), y = 128 + 64 * Math.sin(a);\n    sp += `<path d=\"M120 128L${x.toFixed(1)} ${y.toFixed(1)}\"/>`;\n    pd += `<circle cx=\"${x.toFixed(1)}\" cy=\"${y.toFixed(1)}\" r=\"8.5\" fill=\"${['#F5B700', '#E2453A', '#E8458F'][k % 3]}\"/>`;\n  }\n  document.getElementById('spokes').innerHTML = sp; document.getElementById('pods').innerHTML = pd;\n})();\n<\/script>\n<script>\n/* Demo passport engine: Tap to scan collects the next station, {qr}${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}<\/svg>`;\n  })();\n\n  document.body.insertAdjacentHTML('beforeend', `\n<button id=\"scan\" type=\"button\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16\"/><path d=\"M7 12h10\"/><\/svg><span>Tap to scan<\/span><\/button>\n<div class=\"scanner\" aria-hidden=\"true\"><div class=\"vf\"><i><\/i><i><\/i><i><\/i><i><\/i><div class=\"qr\">${qr}<\/div><b><\/b><\/div><p>Scanning in at<strong><\/strong><\/p><\/div>\n<div class=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n<div class=\"fin\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"fin-t\"><div class=\"fin-card\"><div class=\"fin-ic\" aria-hidden=\"true\">${PP.finIcon || '🎉'}<\/div><h2 id=\"fin-t\">${PP.finTitle}<\/h2><p>${PP.finText}<\/p><div class=\"acts\"><button class=\"again\" type=\"button\">Start over<\/button><button class=\"stay\" type=\"button\">Keep looking<\/button><\/div><\/div><\/div>`);\n\n  const btn = $('#scan'), scanner = $('.scanner'), toastEl = $('.toast'), fin = $('.fin');\n  const counts = () => ({ n: S.filter(s => s.done).length, T: S.length });\n\n  function render() {\n    const { n, T } = counts();\n    $$('[data-count]').forEach(e => e.textContent = n);\n    $$('[data-total]').forEach(e => e.textContent = T);\n    $$('[data-left]').forEach(e => e.textContent = T - n);\n    $$('[data-pct]').forEach(e => e.textContent = Math.round(n / T * 100) + '%');\n    document.documentElement.style.setProperty('--p', (n / T).toFixed(4));\n    S.forEach((s, i) => $$(`[data-st=\"${i}\"]`).forEach(el => {\n      el.classList.toggle('done', !!s.done);\n      $$('[data-time]', el).forEach(t => t.textContent = s.time || 'Just now');\n    }));\n    btn.querySelector('span').textContent = n === T ? 'Start over' : 'Tap to scan';\n    document.body.classList.toggle('complete', n === T);\n    if (PP.render) PP.render(n, T, S);\n  }\n\n  let tt;\n  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('on'), 2600); }\n\n  const next = () => S.findIndex(s => !s.done && !s.auto);\n  let busy = false;\n\n  function scan() {\n    if (busy) return;\n    const { n, T } = counts();\n    if (n === T) { reset(); return; }\n    const i = next(); if (i < 0) return;\n    busy = true;\n    $('strong', scanner).textContent = S[i].name;\n    scanner.classList.add('on');\n    setTimeout(() => {\n      scanner.classList.remove('on');\n      const el = $(`[data-st=\"${i}\"]`);\n      if (el) el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });\n      setTimeout(() => collect(i), reduce ? 60 : 560);\n    }, reduce ? 300 : 1150);\n  }\n\n  function collect(i) {\n    S[i].done = true; S[i].time = 'Just now';\n    render();\n    $$(`[data-st=\"${i}\"]`).forEach(el => { el.classList.remove('just'); void el.offsetWidth; el.classList.add('just'); setTimeout(() => el.classList.remove('just'), 1500); });\n    toast((PP.onCollect && PP.onCollect(i)) || `${S[i].name} collected · +1 pt`);\n    const { n, T } = counts();\n    if (n < T) { busy = false; return; }\n    setTimeout(() => {\n      document.body.classList.add('finale');\n      if (PP.finale) PP.finale();\n      confetti();\n      setTimeout(() => { fin.classList.add('on'); $('.again', fin).focus({ preventScroll: true }); busy = false; }, PP.finDelay || 1500);\n    }, 800);\n  }\n\n  function confetti() {\n    if (reduce) return;\n    const c = document.createElement('div'); c.className = 'conf';\n    const cols = PP.confetti || ['#FF5C8A', '#FFC93C', '#5B8CFF', '#3DD6A3'];\n    for (let k = 0; k < 70; k++) {\n      const i = document.createElement('i');\n      i.style.cssText = `left:${Math.random() * 100}%;background:${cols[k % cols.length]} 3,110,.6)\" stroke=\"${OFF}\" stroke-width=\"2.5\" ${D}/>${num(46, 46, n)}<\/g>`;\n    },\n    res(n) {\n      return `<path d=\"M0 25H24M106 25H130\" stroke=\"${OFF}\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n        <g class=\"y\"><rect x=\"22\" y=\"5\" width=\"86\" height=\"40\" rx=\"20\" fill=\"${ON}\"/><g fill=\"rgba(255,255,255,.35)\"><rect x=\"40\" y=\"5\" width=\"8\" height=\"40\"/><rect x=\"82\" y=\"5\" width=\"8\" height=\"40\"/><\/g>${check(65, 25)}<\/g>\n        <g class=\"n\"><rect x=\"22\" y=\"5\" width=\"86\" height=\"40\" rx=\"20\" fill=\"rgba(40,43,110,.6)\" stroke=\"${OFF}\" stroke-width=\"2.5\" ${D}/>${num(65, 25, n)}<\/g>`;\n    },\n    dimm(n) {\n      let teeth = ''; for (let k = 0; k < 9; k++) teeth += `<rect x=\"${16 + k * 12}\" y=\"48\" width=\"6\" height=\"12\" rx=\"1\"/>`;\n      return `<g class=\"y\"><rect x=\"4\" y=\"4\" width=\"132\" height=\"44\" rx=\"5\" fill=\"${ON}\"/><rect x=\"18\" y=\"13\" width=\"22\" height=\"22\" rx=\"3\" fill=\"rgba(255,255,255,.3)\"/><rect x=\"100\" y=\"13\" width=\"22\" height=\"22\" rx=\"3\" fill=\"rgba(255,255,255,.3)\"/><g fill=\"${GOLD}\">${teeth}<\/g>${check(70, 26)}<\/g>\n        <g class=\"n\"><rect x=\"4\" y=\"4\" width=\"132\" height=\"44\" rx=\"5\" fill=\"rgba(40,43,110,.6)\" stroke=\"${OFF}\" stroke-width=\"2.5\" ${D}/><rect x=\"18\" y=\"13\" width=\"22\" height=\"22\" rx=\"3\" fill=\"none\" stroke=\"${OFF}\" stroke-width=\"2\"/><rect x=\"100\" y=\"13\" width=\"22\" height=\"22\" rx=\"3\" fill=\"none\" stroke=\"${OFF}\" stroke-width=\"2\"/><g fill=\"none\" stroke=\"${OFF}\" stroke-width=\"1.6\">${teeth}<\/g>${num(70, 26, n)}<\/g>`;\n    },\n    tran(n) {\n      return `<path d=\"M30 62V96M45 62V96M60 62V96\" stroke=\"${OFF}\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n        <g class=\"y\"><path d=\"M14 52a31 31 0 0 1 62 0v12H14z\" fill=\"${ON}\"/>${check(45, 44)}<\/g>\n        <g class=\"n\"><path d=\"M14 52a31 31 0 0 1 62 0v12H14z\" fill=\"rgba(40,43,110,.6)\" stroke=\"${OFF}\" stroke-width=\"2.5\" ${D}/>${num(45, 46, n)}<\/g>`;\n    }\n  };\n  const vb = { chip: '0 0 92 92', cap: '0 0 92 92', res: '0 0 130 50', dimm: '0 0 140 62', tran: '0 0 90 100' };\n  document.getElementById('field').insertAdjacentHTML('beforeend', PP.stations.map((s, i) => {\n    const a = Math.min(s.x, 215), b = Math.max(s.x, 215);\n    return `<div class=\"row\" data-st=\"${i}\" style=\"top:${s.y}px\"><span class=\"br\" style=\"left:${a}px;width:${b - a}px\"><\/span><span class=\"jn\"><\/span>\n      <div class=\"comp\" style=\"left:${s.x}px;width:${s.w}px;height:${s.h}px\"><svg class=\"stamp\" viewBox=\"${vb[s.kind]}\" aria-hidden=\"true\">${art[s.kind](i + 1)}<\/svg><\/div>\n      <div class=\"cl\" style=\"left:${s.x}px;top:${s.h / 2 + 16}px\"><span class=\"des\">${s.des}<\/span><b>${s.name}<\/b><span class=\"s\"><span class=\"y\"><strong>Collected<\/strong>&nbsp; <span data-time><\/span>&nbsp; <strong>+1 pts<\/strong><\/span><span class=\"n\">Not yet<\/span><\/span><\/div><\/div>`;\n  }).join(''));\n})();\n<\/script>\n<script>\n/* Demo passport engine: Tap to scan collects the next station, then the theme's finale plays.\n   The page defines window.PP = {stations:[{name, done, time, auto}], finTitle, finText, finIcon, confetti,\n   render(n, T, S), onCollect(i) -> toast text, finale(), reset()} and marks station elements with data-st. */\n(function () {\n  const PP = window.PP, S = PP.stations, INIT = S.map(s => ({ ...s }));\n  const $ = (q, r = document) => r.querySelector(q), $$ = (q, r = document) => [...r.querySelectorAll(q)];\n  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  // a small QR for the scanner\n  let qr = '';\n  (function () {\n    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;\n    const finder = (x, y) => `<rect x=\"${x}\" y=\"${y}\" width=\"7\" height=\"7\" fill=\"#111\"/><rect x=\"${x + 1}\" y=\"${y + 1}\" width=\"5\" height=\"5\" fill=\"#fff\"/><rect x=\"${x + 2}\" y=\"${y + 2}\" width=\"3\" height=\"3\" fill=\"#111\"/>`;\n    for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {\n      if ((x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16)) continue;\n      if (rnd() > .52) qr += `<rect x=\"${x}\" y=\"${y}\" width=\"1\" height=\"1\" fill=\"#111\"/>`;\n    }\n    qr = `<svg viewBox=\"0 0 25 25\" shape-rendering=\"crispEdges\">${qr}${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}<\/svg>`;\n  })();\n\n  document.body.insertAdjacentHTML('beforeend', `\n<button id=\"scan\" type=\"button\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16\"/><path d=\"M7 12h10\"/><\/svg><span>Tap to scan<\/span><\/button>\n<div class=\"scanner\" aria-hidden=\"true\"><div class=\"vf\"><i><\/i><i><\/i><i><\/i><i><\/i><div class=\"qr\">${qr}<\/div><b><\/b><\/div><p>Scanning in at<strong><\/strong><\/p><\/div>\n<div class=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n<div class=\"fin\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"fin-t\"><div class=\"fin-card\"><div class=\"fin-ic\" aria-hidden=\"true\">${PP.finIcon || '🎉'}<\/div><h2 id=\"fin-t\">${PP.finTitle}<\/h2><p>${PP.finText}<\/p><div class=\"acts\"><button class=\"again\" type=\"button\">Start over<\/button><button class=\"stay\" type=\"button\">Keep looking<\/button><\/div><\/div><\/div>`);\n\n  const btn = $('#scan'), scanner = $('.scanner'), toastEl = $('.toast'), fin = $('.fin');\n  const counts = () => ({ n: S.filter(s => s.done).length, T: S.length });\n\n  function render() {\n    const { n, T } = counts();\n    $$('[data-count]').forEach(e => e.textContent = n);\n    $$('[data-total]').forEach(e => e.textContent = T);\n    $$('[data-left]').forEach(e => e.textContent = T - n);\n    $$('[data-pct]').forEach(e => e.textContent = Math.round(n / T * 100) + '%');\n    document.documentElement.style.setProperty('--p', (n / T).toFixed(4));\n    S.forEach((s, i) => $$(`[data-st=\"${i}\"]`).forEach(el => {\n      el.classList.toggle('done', !!s.done);\n      $$('[data-time]', el).forEach(t => t.textContent = s.time || 'Just now');\n    }));\n    btn.querySelector('span').textContent = n === T ? 'Start over' : 'Tap to scan';\n    document.body.classList.toggle('complete', n === T);\n    if (PP.render) PP.render(n, T, S);\n  }\n\n  let tt;\n  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('on'), 2600); }\n\n  const next = () => S.findIndex(s => !s.done && !s.auto);\n  let busy = false;\n\n  function scan() {\n    if (busy) return;\n    const { n, T } = counts();\n    if (n === T) { reset(); return; }\n    const i = next(); if (i < 0) return;\n    busy = true;\n    $('strong', scanner).textContent = S[i].name;\n    scanner.classList.add('on');\n    setTimeout(() => {\n      scanner.classList.remove('on');\n      const el = $(`[data-st=\"${i}\"]`);\n      if (el) el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });\n      setTimeout(() => collect(i), reduce ? 60 : 560);\n    }, reduce ? 300 : 1150);\n  }\n\n  function collect(i) {\n    S[i].done = true; S[i].time = 'Just now';\n    render();\n    $$(`[data-st=\"${i}\"]`).forEach(el => { el.classList.remove('just'); void el.offsetWidth; el.classList.add('just'); setTimeout(() => el.classList.remove('just'), 1500); });\n    toast((PP.onCollect && PP.onCollect(i)) || `${S[i].name} collected · +1 pt`);\n    const { n, T } = counts();\n    if (n < T) { busy = false; return; }\n    setTimeout(() => {\n      document.body.classList.add('finale');\n      if (PP.finale) PP.finale();\n      confetti();\n      setTimeout(() => { fin.classList.add('on'); $('.again', fin).focus({ preventScroll: true }); busy = false; }, PP.finDelay || 1500);\n    }, 800);\n  }\n\n  function confetti() {\n    if (reduce) return;\n    const c = document.createElement('div'); c.className = 'conf';\n    const cols = PP.confetti || ['#FF5C8A', '#FFC93C', '#5B8CFF', '#3DD6A3'];\n    for (let k = 0; k < 70; k++) {\n      const i = document.createElement('i');\n      i.style.cssText = `left:${Math.random() * 100}%;background:${cols[k % cols.length]};--d:${2.3 + Math.random() * 1.8}s;--dl:${Math.random() * .7}s;--dx:${(Math.random() - .5) * 170}px;--rot:${(Math.random() - .5) * 900}deg;${PP.confettiShape || ''}`;\n      c.appendChild(i);\n    }\n    document.body.appendChild(c); setTimeout(() => c.remove(), 5400);\n  }\n\n  function reset() {\n    fin.classList.remove('on'); document.body.classList.remove('finale');\n    S.forEach((s, i) => { Object.assign(s, INIT[i]); if (!INIT[i].time) delete s.time; });\n    if (PP.reset) PP.reset();\n    render();\n    scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });\n  }\n\n  btn.addEventListener('click', scan);\n  $('.again', fin).addEventListener('click', reset);\n  $('.stay', fin).addEventListener('click', () => fin.classList.remove('on'));\n  addEventListener('keydown', e => { if (e.key === 'Escape') fin.classList.remove('on'); });\n  render();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"};

addEventListener('scroll', () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; if (!viewer.hidden) return;
  if (lockTo !== null) { if (Math.abs(scrollY - lockTo * stepH()) < 3) unlock(); return; }
  /* switch a quarter of the way into a swipe, not halfway, so the next passport starts moving right away */
  const raw = scrollY / stepH(), k = raw > step ? Math.floor(raw + .75) : raw < step ? Math.ceil(raw - .75) : step;
  setStep(Math.max(0, Math.min(N, k))); }); }, { passive: true });

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(+g.dataset.go); return; }
  const x = e.target.closest('[data-explore]'); if (x) { openViewer(+x.dataset.explore); return; }
  const s = e.target.closest('.slot'); if (!s) return;
  const i = +s.dataset.i;
  if (s.classList.contains('open')) { if (e.target.closest('.screen,.dp-go')) openViewer(i); }
  else go(i + 1);
});
addEventListener('keydown', e => {
  if (!viewer.hidden) { if (e.key === 'Escape') closeViewer(); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); go(step + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(step - 1); }
});
if (matchMedia('(pointer:fine)').matches && !reduce) addEventListener('pointermove', e => {
  root.style.setProperty('--tx', ((e.clientX / innerWidth - .5) * 7).toFixed(2) + 'deg');
  root.style.setProperty('--ty', ((.5 - e.clientY / innerHeight) * 6).toFixed(2) + 'deg');
});

/* ---------- explore: the passport full screen, for real ---------- */
const viewer = document.getElementById('viewer'), vphone = document.getElementById('vphone'), vt = document.getElementById('vt');
let vi = 0, lastFocus = null;
function openViewer(i) {
  vi = (i + N) % N; const p = P[vi];
  vt.innerHTML = `${p.name}<small>${p.kind === 'live' ? 'Live passport · scroll and tap around' : 'Interactive demo · press Tap to scan'}</small>`;
  vphone.innerHTML = `<iframe title="${p.name} digital passport"></iframe>`;
  const f = vphone.firstChild; if (p.kind === 'live') f.src = p.url; else f.srcdoc = DEMOS[p.id];
  if (viewer.hidden) { lastFocus = document.activeElement; viewer.hidden = false; root.style.overflow = 'hidden'; }
  if (step !== vi + 1) { scrollTo({ top: (vi + 1) * stepH(), behavior: 'auto' }); setStep(vi + 1); }
  document.getElementById('vclose').focus();
}
function closeViewer() { viewer.hidden = true; vphone.innerHTML = ''; root.style.overflow = ''; if (lastFocus) lastFocus.focus({ preventScroll: true }); }
document.getElementById('vclose').addEventListener('click', closeViewer);
document.getElementById('vprev').addEventListener('click', () => openViewer(vi - 1));
document.getElementById('vnext').addEventListener('click', () => openViewer(vi + 1));

/* ---------- start ---------- */
function layout(instant) {
  if (instant) root.classList.add('instant');
  measure(); apply(step < 0 ? 0 : step);
  if (instant) { void slotsEl.offsetWidth; setTimeout(() => root.classList.remove('instant'), 30); }
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => layout(true), 80); });
measure();
const k0 = Math.max(0, Math.min(N, Math.round(scrollY / stepH())));
// entrance: the passports drift up onto the desk one after another
root.classList.add('instant'); step = -1;
const T0 = targets(k0);
slots.forEach((s, i) => { const t = T0[i]; s.style.transform = `translate3d(${t.x}px,${t.y + 90}px,0) rotate(${t.r * 1.6}deg) scale(${(t.s * .9).toFixed(4)})`; s.style.opacity = 0; });
void slotsEl.offsetWidth;
setTimeout(() => {
  root.classList.remove('instant');
  slots.forEach((s, i) => { s.style.transitionDelay = (reduce ? 0 : i * 90) + 'ms'; s.style.opacity = ''; });
  setStep(k0);
  setTimeout(() => slots.forEach(s => s.style.transitionDelay = ''), 1800);
}, 40);
// load the first passport early so it is ready when people get there
setTimeout(() => ensure(0), 1200);
</script>
</body>
